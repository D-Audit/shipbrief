<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dark mode walkthrough preview</title>
  <desc id="desc">A video preview showing an appearance settings panel with dark, light, and system theme choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121227"/><stop offset="1" stop-color="#34306f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292942"/><stop offset="1" stop-color="#1d1d31"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="82" r="220" fill="#817efa" opacity=".14"/>
  <circle cx="132" cy="668" r="230" fill="#6f6ee5" opacity=".11"/>
  <rect x="232" y="92" width="816" height="536" rx="28" fill="url(#card)" stroke="#555478" stroke-width="2"/>
  <text x="286" y="164" fill="#f7f7ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Appearance</text>
  <text x="286" y="198" fill="#b6b6cb" font-family="Arial, sans-serif" font-size="17">Choose what feels best for your workspace.</text>
  <rect x="286" y="244" width="708" height="1" fill="#4a4969"/>
  <text x="286" y="290" fill="#d2d2e3" font-family="Arial, sans-serif" font-size="16" font-weight="700">Theme</text>
  <rect x="286" y="320" width="204" height="178" rx="16" fill="#efeff6"/>
  <rect x="510" y="320" width="204" height="178" rx="16" fill="#161624" stroke="#a8a8ff" stroke-width="3"/>
  <rect x="734" y="320" width="204" height="178" rx="16" fill="#29293d"/>
  <circle cx="320" cy="354" r="12" fill="#fff" stroke="#9999b5" stroke-width="2"/><text x="345" y="360" fill="#4e4e68" font-family="Arial, sans-serif" font-size="16" font-weight="700">Light</text>
  <circle cx="544" cy="354" r="12" fill="#8788f4"/><circle cx="544" cy="354" r="5" fill="#fff"/><text x="569" y="360" fill="#f7f7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Dark</text>
  <circle cx="768" cy="354" r="12" fill="#55556d"/><text x="793" y="360" fill="#ddddef" font-family="Arial, sans-serif" font-size="16" font-weight="700">System</text>
  <rect x="310" y="388" width="156" height="16" rx="8" fill="#d0d0dc"/><rect x="310" y="420" width="120" height="12" rx="6" fill="#d0d0dc"/>
  <rect x="534" y="388" width="156" height="16" rx="8" fill="#747490"/><rect x="534" y="420" width="120" height="12" rx="6" fill="#747490"/>
  <rect x="758" y="388" width="156" height="16" rx="8" fill="#6c6c85"/><rect x="758" y="420" width="120" height="12" rx="6" fill="#6c6c85"/>
  <rect x="286" y="538" width="158" height="45" rx="12" fill="#8586f4"/>
  <text x="320" y="567" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Save changes</text>
</svg>
